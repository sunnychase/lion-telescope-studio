name: Feature request
description: A new survey, archive, panel or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Data source (if any)
      description: Link, terms of use (open, non-commercial, all rights reserved?), rate limits, and whether it needs a key.
